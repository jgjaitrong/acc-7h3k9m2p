<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบบัญชี QT / INV / RC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#2a78d6; --brand-d:#1c5cab; --brand-l:#3987e5; --brand-100:#e7f0fc;
  --navy1:#1b2a4a; --navy2:#12203c;
  --plane:#f3f5fb; --surface:#ffffff; --surface-2:#f8fafc;
  --ink:#0b1220; --ink-2:#475569; --muted:#8a93a6; --line:#e7eaf2;
  --good:#0ca30c; --good-bg:#e6f7e6; --good-ink:#0a7a0a;
  --warn:#b7791f; --warn-bg:#fdf3d9; --warn-dot:#fab219;
  --crit:#d03b3b; --crit-bg:#fbe6e6; --crit-ink:#b02a2a;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);
  --r:14px; --r-sm:9px;
  --sans:'Sarabun','Prompt','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--plane);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
svg{width:18px;height:18px;flex:0 0 auto}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#cdd5e4;border-radius:8px;border:2px solid var(--plane)}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.side{width:248px;background:linear-gradient(180deg,var(--navy1),var(--navy2));color:#dbe4f5;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:20}
.brand{padding:22px 20px 16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--brand-l),var(--brand-d));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px;flex:0 0 auto;box-shadow:0 4px 12px rgba(42,120,214,.4)}
.brand>div{min-width:0;flex:1}
.brand b{font-size:15px;color:#fff;font-weight:700;letter-spacing:.2px;font-family:'Prompt',var(--sans);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:11px;color:#93a4c4;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{padding:14px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.nav a{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:10px;color:#c3cfe4;font-weight:500;font-size:14px;transition:.15s;cursor:pointer}
.nav a svg{width:19px;height:19px;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:linear-gradient(90deg,rgba(42,120,214,.9),rgba(42,120,214,.55));color:#fff;box-shadow:0 4px 14px rgba(42,120,214,.35)}
.nav a.on svg{opacity:1}
.side .foot{padding:14px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#8092b4}
.main{margin-left:248px;flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:10;background:rgba(243,245,251,.85);backdrop-filter:blur(8px);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.top h1{font-size:20px;font-weight:700;font-family:'Prompt',var(--sans)}
.top .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.content{padding:26px 32px 60px;max-width:1180px;width:100%}

/* ---------- buttons ---------- */
.btn{display:inline-flex;gap:7px;align-items:center;justify-content:center;padding:10px 16px;border-radius:10px;font-weight:600;font-size:13.5px;transition:.15s;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-p{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(42,120,214,.28)}
.btn-p:hover{background:var(--brand-d)}
.btn-g{background:var(--surface);color:var(--ink-2);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.btn-g:hover{background:var(--surface-2);color:var(--ink)}
.btn-d{background:#fff;color:var(--crit);border:1px solid #f3d0d0}
.btn-d:hover{background:var(--crit-bg)}
.btn-sm{padding:7px 11px;font-size:12.5px;border-radius:8px}
.btn-ic{width:34px;height:34px;padding:0;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(3,1fr)}
.stat{padding:18px 20px;position:relative;overflow:hidden}
.stat .lab{font-size:12.5px;color:var(--ink-2);font-weight:500;display:flex;gap:8px;align-items:center}
.stat .chip{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.stat .chip svg{width:17px;height:17px}
.stat .val{font-size:27px;font-weight:700;margin-top:12px;letter-spacing:-.4px}
.stat .val small{font-size:14px;color:var(--muted);font-weight:500;margin-left:3px}
.stat .meta{font-size:11.5px;color:var(--muted);margin-top:3px}

/* ---------- table ---------- */
.tbl-wrap{overflow-x:auto;border-radius:var(--r)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--surface)}
.tbl th{text-align:left;font-weight:600;color:var(--ink-2);background:var(--surface-2);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:.12s}
.tbl tbody tr:hover{background:var(--brand-100)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-variant-numeric:tabular-nums}
.jobid{font-weight:700;color:var(--brand-d);font-variant-numeric:tabular-nums}

/* ---------- pills / badges ---------- */
.pill{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%}
.pill.good{background:var(--good-bg);color:var(--good-ink)} .pill.good .dot{background:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.warn .dot{background:var(--warn-dot)}
.pill.crit{background:var(--crit-bg);color:var(--crit-ink)} .pill.crit .dot{background:var(--crit)}
.pill.mute{background:#eef1f6;color:#64748b} .pill.mute .dot{background:#94a3b8}
.tag{display:inline-flex;align-items:center;padding:3px 8px;border-radius:6px;font-size:11.5px;font-weight:600}
.tag.qt{background:#eef4fd;color:#2560a8} .tag.inv{background:#fff3e0;color:#b06a12} .tag.rc{background:#e9f7ee;color:#128041} .tag.off{background:#f1f3f7;color:#9aa3b2}

/* ---------- forms ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(42,120,214,.14)}
.field .hint{font-size:11px;color:var(--muted);margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(3px);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:var(--surface);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.28);width:100%;max-width:620px;animation:pop .18s ease}
.modal.wide{max-width:860px}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal .mh{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal .mh h3{font-size:17px;font-weight:700;font-family:'Prompt',var(--sans)}
.modal .mb{padding:22px 24px;max-height:66vh;overflow-y:auto}
.modal .mf{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--surface-2);border-radius:0 0 16px 16px}
.x{width:34px;height:34px;border-radius:8px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.x:hover{background:var(--surface-2);color:var(--ink)}

/* ---------- items editor ---------- */
.items{width:100%;border-collapse:collapse;margin-top:4px}
.items th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px}
.items td{padding:4px}
.items input{padding:8px 9px}
.items .del{color:var(--crit);width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.items .del:hover{background:var(--crit-bg)}
.sumbox{margin-top:14px;margin-left:auto;width:290px;font-size:13.5px}
.sumbox .r{display:flex;justify-content:space-between;padding:5px 0}
.sumbox .r.tot{border-top:2px solid var(--line);margin-top:5px;padding-top:9px;font-weight:700;font-size:16px;color:var(--brand-d)}

/* ---------- misc ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip-f{padding:8px 15px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2);transition:.15s}
.chip-f:hover{border-color:var(--brand);color:var(--brand-d)}
.chip-f.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.chip-f .c{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:rgba(0,0,0,.08);font-size:11px}
.chip-f.on .c{background:rgba(255,255,255,.25)}
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty svg{width:52px;height:52px;opacity:.4;margin-bottom:12px}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px}
.sec-t{font-size:15px;font-weight:700;margin:2px 0 14px;font-family:'Prompt',var(--sans);display:flex;align-items:center;gap:8px}
.toast{position:fixed;bottom:24px;right:24px;z-index:80;display:flex;flex-direction:column;gap:10px}
.toast .t{background:#1e293b;color:#fff;padding:13px 18px;border-radius:11px;font-size:13.5px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:slide .25s ease;display:flex;gap:9px;align-items:center}
.toast .t.ok{background:#0f8a3c}.toast .t.err{background:#c0392b}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.logo-prev{width:56px;height:56px;border-radius:10px;object-fit:contain;background:#fff;border:1px solid var(--line)}

/* ---------- chart ---------- */
.chart-card{padding:20px 22px}
.chart-svg{width:100%;height:auto;display:block;overflow:visible}
.bars{display:flex;align-items:flex-end;gap:14px;height:180px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:46px;background:linear-gradient(180deg,var(--brand-l),var(--brand));border-radius:5px 5px 3px 3px;transition:.4s cubic-bezier(.2,.7,.3,1);position:relative;min-height:3px}
.bar:hover{filter:brightness(1.08)}
.bar-col .bl{font-size:11.5px;color:var(--muted)}
.bar-col .bv{font-size:11px;color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.segbar{display:flex;height:26px;border-radius:8px;overflow:hidden;margin:6px 0 4px;background:#eef1f6}
.segbar div{transition:.4s}

/* ---------- print ---------- */
#print{display:none}
@media print{
  html,body{background:#fff!important;margin:0!important}
  .app,#overlay,.toast{display:none!important}
  #print{display:block!important;position:static!important;width:auto!important;background:#fff}
  #print .doc{page-break-after:always}
  #print .doc:last-child{page-break-after:auto}
  @page{size:A4 portrait;margin:10mm}
}
/* ===== document layout (QT / INV / RC) ===== */
.doc{font-family:var(--sans);color:#1a2233;width:190mm;margin:0 auto;font-size:12px;position:relative;background:#fff}
.doc .accent{height:4px;background:var(--brand)}
.doc .projbar{margin:0 0 8px;background:var(--brand-100);border:1px solid #cfe0f8;border-radius:9px;padding:9px 16px;display:flex;gap:12px;align-items:baseline}
.doc .projbar .pl{color:#7a8598;font-size:10px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.doc .projbar .pv{color:var(--brand-d);font-size:14.5px;font-weight:700;font-family:'Prompt',var(--sans)}
.doc .pad{padding:7mm 8mm}
.doc .stamp{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%) rotate(-15deg);border:4px double var(--good);color:var(--good);font-size:32px;font-weight:800;font-family:'Prompt',var(--sans);padding:5px 24px;border-radius:12px;opacity:.14;letter-spacing:3px;pointer-events:none}
.doc .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.doc .dh>div:first-child{flex:1 1 auto;min-width:0}
.doc .co-n{font-size:15px;font-weight:700;color:var(--brand-d);font-family:'Prompt',var(--sans);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px}
.doc .co-i{font-size:10.5px;color:#5a6577;margin-top:5px;line-height:1.6}
.doc .badge{text-align:right;flex:0 0 auto}
.doc .badge .tt{display:inline-block;background:#fff;color:var(--brand-d);font-size:14px;font-weight:700;font-family:'Prompt',var(--sans);padding:7px 13px;border-radius:10px;border:2px solid var(--brand-d);white-space:nowrap}
.doc .badge .te{font-size:10px;color:#9aa4b5;letter-spacing:2px;margin-top:6px;font-weight:600}
.doc .parties{display:flex;gap:14px;margin:16px 0}
.doc .pcard{flex:1;background:#f7f9fc;border:1px solid #e8edf5;border-radius:11px;padding:12px 14px}
.doc .pcard.meta{flex:0 0 42%;background:#fff}
.doc .pt{font-size:9.5px;color:#98a3b5;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.doc .pn{font-weight:700;font-size:11.5px;color:#1a2233;line-height:1.45}
.doc .pa{font-size:10.5px;color:#5a6577;line-height:1.55;margin-top:3px}
.doc .proj-in{margin-top:7px;padding-top:6px;border-top:1px dashed #d7e0ee;font-size:11px;color:#7a8598}
.doc .proj-in b{color:var(--brand-d);font-size:12.5px;font-family:'Prompt',var(--sans)}
.doc.ink .proj-in{border-color:#ccc}.doc.ink .proj-in b{color:#111}
.doc .kv{display:flex;justify-content:space-between;font-size:11.5px;padding:4px 0;border-bottom:1px dashed #e3e8f0}
.doc .kv:last-child{border-bottom:none}
.doc .kv span{color:#7a8598}
.doc .kv b{color:#1a2233}
.doc table.it{width:100%;border-collapse:collapse;margin-top:4px;font-size:11.5px}
.doc table.it thead th{background:#eaf1fb;color:var(--brand-d);padding:9px 10px;text-align:left;font-weight:700;font-size:11px;border-bottom:2px solid var(--brand-d)}
.doc table.it th:first-child{border-radius:8px 0 0 0}
.doc table.it th:last-child{border-radius:0 8px 0 0}
.doc table.it th.n,.doc table.it td.n{text-align:right}
.doc table.it th.c,.doc table.it td.c{text-align:center}
.doc table.it tbody td{padding:8px 10px;border-bottom:1px solid #eef1f7}
.doc table.it tbody tr:nth-child(even){background:#f8fafd}
.doc .btm{display:flex;justify-content:space-between;gap:22px;margin-top:14px;align-items:flex-start}
.doc .lft{flex:1;min-width:0}
.doc .baht{background:var(--brand-100);border:1px solid #cfe0f8;border-radius:9px;padding:9px 12px;font-size:11.5px;font-weight:600;color:var(--brand-d)}
.doc .note{font-size:10.5px;color:#3a4557;margin-top:10px;line-height:1.7}
.doc .note b{color:var(--brand-d)}
.doc .bankcard{margin-top:10px;background:#f7f9fc;border:1px solid #e8edf5;border-radius:9px;padding:10px 12px;font-size:10.5px;color:#3a4557}
.doc .bankcard b{color:var(--brand-d)}
.doc .tot{flex:0 0 43%}
.doc .tot .tr{display:flex;justify-content:space-between;padding:5px 10px;font-size:12px}
.doc .tot .tr.g{background:#eaf1fb;color:var(--brand-d);border:1.5px solid var(--brand-d);border-radius:9px;padding:11px 12px;font-weight:700;font-size:15px;margin-top:6px}
.doc .sign{display:flex;justify-content:space-between;margin-top:34px;gap:30px}
.doc .sign .s{flex:1;text-align:center;font-size:10.5px;color:#5a6577}
.doc .sign .sl{border-top:1px dotted #aab3c2;margin:26px 14px 6px}
.doc .sign .snm{font-weight:700;color:#1a2233;font-size:11.5px}
.doc .foot{margin-top:16px;border-top:2px solid #eef2f8;padding-top:9px;text-align:center;font-size:10px;color:#9aa4b5}
.rcok{background:#e9f7ee;border-color:#bfe6cd!important;color:#0a7a3a}
.doc.ink .accent{background:#444}
.doc.ink .projbar{background:#fff;border-color:#ccc}.doc.ink .projbar .pv{color:#111}
.doc.ink .co-n{color:#111}
.doc.ink .badge .tt{background:#fff;color:#111;border:1.5px solid #111}
.doc.ink table.it thead th{background:#ededed;color:#000}
.doc.ink table.it tbody tr:nth-child(even){background:#fff}
.doc.ink table.it tbody td{border-bottom:1px solid #cfcfcf}
.doc.ink .baht{background:#fff;border-color:#bbb;color:#111}
.doc.ink .tot .tr.g{background:#fff;color:#111;border:2px solid #111}
.doc.ink .stamp{color:#666;border-color:#666}
.doc.ink .pcard,.doc.ink .pcard.meta{background:#fff;border-color:#ccc}
.doc.ink .bankcard{background:#fff;border-color:#ccc}
.doc.ink .rcok{background:#fff!important;color:#111;border-color:#ccc!important}
/* ===== 50 ทวิ withholding certificate ===== */
.wht50{width:188mm;margin:0 auto;font-family:var(--sans);color:#111;font-size:9.7px;line-height:1.34;background:#fff}
.wht50 *{box-sizing:border-box}
.wht50 .hdln{display:flex;justify-content:space-between;align-items:flex-end;font-size:8.4px;margin-bottom:2px;font-style:italic}
.wht50 .frame{border:1.3px solid #111}
.wht50 .ttl{text-align:center;font-weight:700;font-size:13px;padding-top:5px;font-family:'Prompt',var(--sans)}
.wht50 .ttl2{text-align:center;font-size:9px;padding-bottom:3px}
.wht50 .sec{border-top:1.1px solid #111;padding:3px 7px}
.wht50 .lbl{font-weight:700}
.wht50 .digits{display:inline-flex;align-items:center;vertical-align:middle}
.wht50 .digits span{border:1px solid #111;width:12px;height:15px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-family:'Courier New',monospace;margin-left:-1px}
.wht50 .digits b{width:4px;display:inline-block}
.wht50 .cb{display:inline-block;width:10px;height:10px;border:1.1px solid #111;text-align:center;line-height:9px;font-size:8px;font-weight:700;margin:0 3px 0 7px;vertical-align:middle}
.wht50 .fbnd{font-size:8.7px;line-height:1.9}
.wht50 table.inc{width:100%;border-collapse:collapse;border-top:1.1px solid #111}
.wht50 table.inc td{border:1px solid #111;padding:2px 5px;vertical-align:top}
.wht50 table.inc td.n{text-align:right;font-family:'Courier New',monospace;white-space:nowrap;width:25mm}
.wht50 table.inc td.d{text-align:center;width:20mm;font-size:8.6px;font-family:'Courier New',monospace}
.wht50 .totrow td{font-weight:700;background:#f3f3f3}
.wht50 .baht{border-top:1.1px solid #111;background:#ededed;padding:3px 7px;font-weight:700}
.wht50 .sign{display:flex;justify-content:space-between;gap:18px;padding:7px;border-top:1.1px solid #111}
.wht50 .foot{font-size:7.7px;padding:3px 7px;color:#333;text-align:center}
.doc.ink .wht50 .totrow td,.doc.ink .wht50 .baht{background:#fff}
/* ===== official ภ.ง.ด.3 / 50 ทวิ overlay on real form image ===== */
@page pnd3{size:A4 portrait;margin:0}
.pnd3wrap{page:pnd3}
.pnd3{position:relative;width:209.9mm;height:297.1mm;background-repeat:no-repeat;background-position:0 0;background-size:209.9mm 297.1mm;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-family:'Sarabun','Prompt',var(--sans);color:#000;overflow:hidden}
.pnd3 span{position:absolute;line-height:1;white-space:nowrap;font-weight:500}
.dpk{position:relative;display:block;width:100%}
.dpk>input[type="text"]{width:100%;padding-right:36px;box-sizing:border-box}
.dpk>input.dpk-cal{position:absolute!important;right:3px!important;left:auto!important;top:0;bottom:0;margin:auto 0!important;height:30px!important;width:30px!important;min-width:0!important;border:none!important;background:transparent!important;box-shadow:none!important;padding:0!important;color:transparent!important;cursor:pointer}
.dpk>input.dpk-cal::-webkit-datetime-edit,.dpk>input.dpk-cal::-webkit-inner-spin-button,.dpk>input.dpk-cal::-webkit-clear-button{display:none!important}
.dpk>input.dpk-cal::-webkit-calendar-picker-indicator{opacity:.55;cursor:pointer;padding:0;margin:0}
@media(max-width:820px){.side{transform:translateX(-100%);transition:.25s}.side.open{transform:none}.main{margin-left:0}.top{padding:16px 18px}.content{padding:20px 18px}.stats{grid-template-columns:1fr}.row2,.row3{grid-template-columns:1fr}.menu-btn{display:flex!important}}
.sugwrap{position:relative;flex:1;min-width:240px}
.sugwrap>input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:13.5px;box-sizing:border-box}
.sugbox{position:absolute;z-index:60;left:0;right:0;top:calc(100% + 5px);background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 12px 30px rgba(20,40,80,.16);max-height:320px;overflow:auto}
.sughd{padding:8px 13px;font-size:11.5px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.sugit{display:flex;align-items:center;gap:10px;padding:9px 13px;cursor:pointer;border-bottom:1px solid #f2f5fa}
.sugit:last-child{border-bottom:none}
.sugit:hover{background:var(--brand-100)}
.sugcode{font-weight:700;color:var(--brand-d);font-family:ui-monospace,Menlo,monospace;font-size:12.5px;min-width:62px}
.sugname{flex:1;font-size:13px;color:var(--ink)}
.sugn{font-size:11.5px;color:var(--muted);white-space:nowrap}
.sugempty{padding:11px 13px;font-size:12.5px;color:var(--muted);line-height:1.6}
.custchip{display:inline-flex;align-items:center;gap:7px;background:var(--brand-100);border:1px solid #cfe0f8;color:var(--brand-d);border-radius:20px;padding:5px 6px 5px 12px;font-size:13px;white-space:nowrap}
.custchip b{font-family:ui-monospace,Menlo,monospace}
.custchip button{border:none;background:#dbe7fa;color:var(--brand-d);border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:12px;line-height:1}
.custchip button:hover{background:#c3d8f5}
.whtbar{display:flex;align-items:flex-start;gap:10px;background:var(--brand-100);border:1px solid #cfe0f8;border-radius:10px;padding:11px 13px;margin:4px 0 12px;font-size:13px;line-height:1.6;cursor:pointer}
.whtbar input{margin-top:3px;width:17px;height:17px;flex:0 0 auto;cursor:pointer}
.menu-btn{display:none;width:38px;height:38px;border-radius:9px;background:var(--surface);border:1px solid var(--line);align-items:center;justify-content:center}
th.sorth{cursor:pointer;user-select:none;white-space:nowrap}
th.sorth:hover{color:var(--brand-d);background:var(--brand-100)}
th.sorth .ar{font-size:9px;margin-left:3px;color:var(--brand-d)}
th.sorth.on{color:var(--brand-d)}

let gsT=null;

async function gsBackup(silent){const c=gsCfg();if(!c.url){if(!silent)toast('ยังไม่ได้ตั้งค่าลิงก์ Google Sheet','err');return false;}try{const body=JSON.stringify({action:'backup',savedAt:localSavedAt()||Date.now(),data:state});await fetch(c.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body});gsCfgSave({...c,last:Date.now()});if(!silent)toast('สำรองขึ้น Google Sheet แล้ว','ok');return true;}catch(e){if(!silent)toast('สำรองขึ้น Google Sheet ไม่สำเร็จ','err');return false;}}
function gsRestore(){const c=gsCfg();if(!c.url){toast('ยังไม่ได้ตั้งค่าลิงก์ Google Sheet','err');return;}if(!confirm('กู้คืนข้อมูลจาก Google Sheet? ข้อมูลปัจจุบันในเครื่องนี้จะถูกแทนที่ด้วยชุดสำรองล่าสุด'))return;const cb='gsCB_'+Date.now();const s=document.createElement('script');let done=false;const cleanup=()=>{done=true;try{delete window[cb];}catch(e){window[cb]=undefined;}s.remove();};window[cb]=(resp)=>{if(done)return;try{if(resp&&resp.data){if(adoptCloud(resp.data,resp.savedAt,'กู้คืนข้อมูลจาก Google Sheet แล้ว'))cloudQueue();}else toast('ยังไม่พบข้อมูลสำรองใน Google Sheet','err');}catch(e){toast('กู้คืนไม่สำเร็จ','err');}cleanup();};s.onerror=()=>{if(!done){toast('เชื่อมต่อ Google Sheet ไม่สำเร็จ','err');cleanup();}};s.src=c.url+(c.url.includes('?')?'&':'?')+'action=restore&callback='+cb+'&_='+Date.now();document.body.appendChild(s);setTimeout(()=>{if(!done){toast('หมดเวลาเชื่อมต่อ Google Sheet','err');cleanup();}},15000);}

/* ============ HELPERS ============ */
const B=(n)=>Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const B0=(n)=>Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:0});
function dTH(iso){if(!iso)return'-';const[y,m,d]=iso.split('-');return`${d}/${m}/${y}`;}
function parseDMY(s){s=String(s||'').trim();if(!s)return '';if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);if(!m){const d=s.replace(/\D/g,'');if(d.length===8)m=[0,d.slice(0,2),d.slice(2,4),d.slice(4)];}if(!m)return '';const dd=parseInt(m[1],10),mo=parseInt(m[2],10),y=parseInt(m[3],10);if(!(dd>=1&&dd<=31&&mo>=1&&mo<=12&&y>=1900&&y<=3000))return '';return y+'-'+String(mo).padStart(2,'0')+'-'+String(dd).padStart(2,'0');}
function dpick(id,iso,dis){iso=iso||'';const t=iso?dTH(iso):'';if(dis)return `<span class="dpk"><input id="${id}" type="text" value="${t}" disabled></span>`;return `<span class="dpk"><input id="${id}" type="text" inputmode="numeric" maxlength="10" placeholder="วว/ดด/ปปปป (ค.ศ.)" value="${t}" onchange="dpkNorm(this)" autocomplete="off"><input type="date" class="dpk-cal" value="${iso}" onchange="dpkSet(this)" tabindex="-1" aria-label="เลือกวันที่จากปฏิทิน"></span>`;}
function dpkNorm(el){const iso=parseDMY(el.value);if(iso){el.value=dTH(iso);const cal=el.parentNode&&el.parentNode.querySelector('.dpk-cal');if(cal)cal.value=iso;}else if(el.value.trim()===''){const cal=el.parentNode&&el.parentNode.querySelector('.dpk-cal');if(cal)cal.value='';}}
function dpkSet(cal){const txt=cal.parentNode&&cal.parentNode.querySelector('input[type="text"]');if(txt&&cal.value)txt.value=dTH(cal.value);}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+Number(n||0));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function esc(s){return String(s==null?'':s).replace(/[&<>"'`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));}
/* สร้าง id ไม่ซ้ำแน่นอน (กันชนกันตอนนำเข้าไฟล์ทีละหลายรายการ) */
let _uidSeq=0;
function uid(p){return (p||'X')+Date.now().toString(36)+(_uidSeq++).toString(36)+Math.random().toString(36).slice(2,7);}
function cust(code){return state.customers.find(c=>c.code===code)||null;}
/* ---- installment-aware helpers (no compute() call inside instSub/instAmt to avoid recursion) ---- */
function instSub(j,pct){const sub=(j.items||[]).reduce((a,i)=>a+(Number(i.qty)||0)*(Number(i.price)||0),0);return Math.round(sub*(Number(pct)||0))/100;}
function instAmt(j,pct){const s=instSub(j,pct);const v=(j.vat===false)?0:Math.round(s*state.settings.vatRate*100)/100;return Math.round((s+v)*100)/100;}
function jobSub(j){return Math.round((j.items||[]).reduce((a,i)=>a+(Number(i.qty)||0)*(Number(i.price)||0),0)*100)/100;}
/* ยอดก่อน VAT ของงวดหนึ่ง — รองรับทั้งกรอกเป็น % และกรอกเป็นจำนวนเงินบาท */
function instBase(j,it){if(!it)return 0;if(it.mode==='baht'&&isFinite(Number(it.amt)))return Math.round((Number(it.amt)||0)*100)/100;return instSub(j,it.pct);}
function instTot(j,it){const b=instBase(j,it);const v=(j.vat===false)?0:Math.round(b*state.settings.vatRate*100)/100;return Math.round((b+v)*100)/100;}
function instPctOf(j,it){const sub=jobSub(j);if(!sub)return 0;return Math.round(instBase(j,it)/sub*10000)/100;}
function jobReceipts(j){var a=(j.payments||[]).slice();(j.installments||[]).forEach(function(i){if(i.rc&&i.rc.issued)a.push({date:i.rc.date,method:i.rc.method,amount:Number(i.rc.amount)||0,wht:Number(i.rc.wht)||0});});return a;}
function jobBilled(j){return !!(j.inv&&j.inv.issued)||((j.installments||[]).length>0);}
function jobRcDone(j){return !!j.rcIssued||(j.installments||[]).some(function(i){return i.rc&&i.rc.issued;});}
function billDate(j){return (j.inv&&j.inv.date)||((j.installments||[])[0]&&j.installments[0].date)||j.qtDate;}
/* วันที่รับเงินทั้งหมดของงานนี้ เรียงจากเก่าไปใหม่ */
function jobRcDates(j){return jobReceipts(j).map(function(r){return r&&r.date;}).filter(Boolean).sort();}
/* เดือนที่งานนี้ควรไปอยู่ในแถบเลือกเดือน
   — งานที่รับเงินแล้ว ให้ไปอยู่ “เดือนที่เงินเข้าจริง” (ขึ้นได้หลายเดือนถ้าแบ่งงวดรับคนละเดือน)
   — งานที่ยังเก็บเงินไม่ครบ ยังคงอยู่ในเดือนของใบเสนอราคาด้วย จะได้ไม่หลุดจากสายตา */
function jobMonthKeys(j){
 const ks=new Set();
 jobRcDates(j).forEach(function(d){ks.add(String(d).slice(0,7));});
 let paidFull=false;try{paidFull=compute(j).pay==='paid';}catch(e){}
 const qm=j.qtDate?String(j.qtDate).slice(0,7):'';
 if(qm&&(!ks.size||!paidFull))ks.add(qm);
 if(!ks.size){const bd=billDate(j);if(bd)ks.add(String(bd).slice(0,7));}   /* งานที่ไม่มีวันที่ใบเสนอราคา ยังต้องหาเจอในแถบเดือน */
 return Array.from(ks);
}
/* billing events: one row per installment (or the single full invoice) — {date, sub, total} */
function billEvents(j){const insts=j.installments||[];if(insts.length)return insts.map(function(i){var s=instBase(j,i);return {date:i.date,sub:s,total:instTot(j,i)};});if(j.inv&&j.inv.issued){var c=compute(j);return [{date:j.inv.date,sub:c.sub,total:c.total}];}return [];}
function compute(j){
 const sub=(j.items||[]).reduce((a,i)=>a+(Number(i.qty)||0)*(Number(i.price)||0),0);
 const rate=(j.vat===false)?0:state.settings.vatRate;
 const vat=Math.round(sub*rate*100)/100;const total=Math.round((sub+vat)*100)/100;
 const rcs=jobReceipts(j);
 const paid=rcs.reduce((a,p)=>a+(Number(p.amount)||0),0);
 const wht=rcs.reduce((a,p)=>a+(Number(p.wht)||0),0);
 const settled=Math.round((paid+wht)*100)/100;
 const insts=j.installments||[];const hasInst=insts.length>0;
 const billed=jobBilled(j);
 let billedAmt=0;
 if(hasInst)billedAmt=Math.round(insts.reduce((a,i)=>a+instTot(j,i),0)*100)/100;
 else if(j.inv&&j.inv.issued)billedAmt=total;
 const outstanding=Math.round((billedAmt-settled)*100)/100;   /* billed but not yet received (true AR) */
 const bal=Math.round((total-settled)*100)/100;                /* remaining to collect on whole job */
 const sumPct=hasInst?(sub?Math.round(insts.reduce((a,i)=>a+instBase(j,i),0)/sub*10000)/100:0):100;
 let pay='none';
 if(billed){if(outstanding<=0.005&&sumPct>=99.5)pay='paid';else if(settled>0)pay='partial';else pay='pending';}
 let due=null,overdue=0;
 if(hasInst){const unpaid=insts.filter(i=>!(i.rc&&i.rc.issued));if(unpaid.length){due=unpaid.map(i=>addDays(i.date,(i.creditDays!=null?i.creditDays:state.settings.creditDays))).sort()[0];if(due&&todayISO()>due)overdue=Math.round((new Date(todayISO())-new Date(due))/864e5);}}
 else if(j.inv&&j.inv.issued){due=addDays(j.inv.date,j.inv.creditDays);if((pay==='pending'||pay==='partial')&&due&&todayISO()>due)overdue=Math.round((new Date(todayISO())-new Date(due))/864e5);}
 return{sub,vat,total,paid,wht,settled,billedAmt,outstanding,bal,sumPct,pay,due,overdue,hasInst};
}
/* เรียงลำดับแบบธรรมชาติ: ตัวเลขเรียงตามค่าจริง (2 มาก่อน 10) ตัวอักษรเรียง ก-ฮ / A-Z */
function natCmp(a,b){a=String(a==null?'':a).trim();b=String(b==null?'':b).trim();
 const sp=s=>{const o=[];s.replace(/(\d+)|(\D+)/g,function(_,n,t){o.push(n!==undefined?{n:parseFloat(n)}:{t:t});});return o;};
 const A=sp(a),B=sp(b);
 for(let i=0;i<Math.max(A.length,B.length);i++){
  const x=A[i],y=B[i];
  if(x===undefined)return -1;if(y===undefined)return 1;
  if(x.n!==undefined&&y.n!==undefined){if(x.n!==y.n)return x.n<y.n?-1:1;}
  else if(x.n!==undefined)return -1;
  else if(y.n!==undefined)return 1;
  else{const d=x.t.localeCompare(y.t,'th');if(d)return d;}
 }
 return a===b?0:(a<b?-1:1);}
function sortTh(cur,k,dir,label,fn,cls){return `<th class="sorth ${cur===k?'on':''} ${cls||''}" onclick="${fn}('${k}')" title="คลิกเพื่อเรียงลำดับ">${label}<span class="ar">${cur===k?(dir>0?'▲':'▼'):'⇅'}</span></th>`;}
function nextId(code,date){const pre=code+'-'+date.replace(/-/g,'');let mx=0;state.jobs.forEach(j=>{if(j.id.startsWith(pre+'-')){const n=parseInt(j.id.slice(pre.length+1));if(n>mx)mx=n;}});return pre+'-'+(mx+1);}

/* ============ BAHT TEXT ============ */
function bahttext(num){num=Math.round((Number(num)+1e-9)*100)/100;let baht=Math.floor(num),st=Math.round((num-baht)*100);const tn=['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],tp=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
 function conv(n){if(n===0)return'';let s='';if(n>=1000000){s+=conv(Math.floor(n/1000000))+'ล้าน';n%=1000000;}const d=String(n),L=d.length;for(let i=0;i<L;i++){const v=+d[i],p=(L-i-1)%6;if(v===0)continue;if(p===0&&v===1&&L>1)s+='เอ็ด';else if(p===1&&v===2)s+='ยี่สิบ';else if(p===1&&v===1)s+='สิบ';else s+=tn[v]+tp[p];}return s;}
 if(baht===0&&st===0)return'ศูนย์บาทถ้วน';let r='';if(baht>0)r+=conv(baht)+'บาท';if(st>0)r+=conv(st)+'สตางค์';else if(baht>0)r+='ถ้วน';return r;}

/* ============ FINANCE (สถานะการเงินผู้บริหาร) ============ */
let finPeriod='all';
function periodOK(iso){if(finPeriod==='all')return true;if(!iso)return false;if(finPeriod==='3m'){const t=new Date(todayISO());const from=new Date(t.getFullYear(),t.getMonth()-2,1);const d=new Date(iso+'T00:00:00');return d>=from&&d<=t;}if(finPeriod==='year')return iso.slice(0,4)===todayISO().slice(0,4);return iso.slice(0,7)===finPeriod;}
const MNS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function last6(){const now=new Date(todayISO());const a=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);a.push({y:d.getFullYear(),m:d.getMonth(),label:MNS[d.getMonth()]});}return a;}
function activityMonths(){const s={};const add=d=>{if(d)s[d.slice(0,7)]=1;};state.jobs.forEach(j=>{add(j.qtDate);billEvents(j).forEach(ev=>add(ev.date));jobReceipts(j).forEach(p=>add(p.date));});state.expenses.forEach(e=>add(e.date));state.statements.forEach(t=>add(t.date));return Object.keys(s).sort().reverse();}
function svgBars2(mos,a,b){const W=580,H=210,L=44,R=12,T=12,Bt=176;const pw=W-L-R;const max=Math.max(1,...a,...b);
 let g='';[0,.25,.5,.75,1].forEach(f=>{const y=Bt-f*(Bt-T);const v=max*f;g+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#e7eaf2"/><text x="${L-6}" y="${y+3}" text-anchor="end" font-size="9" fill="#8a93a6">${v>=1000?Math.round(v/1000)+'k':Math.round(v)}</text>`;});
 const cw=pw/mos.length;const bw=Math.min(15,cw/2-4);let bars='';
 mos.forEach((mo,i)=>{const cx=L+cw*(i+0.5);const av=a[i]||0,bv=b[i]||0;const ay=Bt-av/max*(Bt-T),by=Bt-bv/max*(Bt-T);
  bars+=`<rect x="${cx-bw-2}" y="${ay}" width="${bw}" height="${Math.max(0,Bt-ay)}" rx="3" fill="#2a78d6"><title>${mo.label} รายรับ ${B(av)}</title></rect>`;
  bars+=`<rect x="${cx+2}" y="${by}" width="${bw}" height="${Math.max(0,Bt-by)}" rx="3" fill="#eb6834"><title>${mo.label} รายจ่าย ${B(bv)}</title></rect>`;
  bars+=`<text x="${cx}" y="${Bt+15}" text-anchor="middle" font-size="10" fill="#8a93a6">${mo.label}</text>`;});
 return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}">${g}${bars}</svg>`;}
function svgProfit(mos,vals){const W=580,H=210,L=44,R=12,T=14,Bt=172;const pw=W-L-R;const hi=Math.max(1,...vals),lo=Math.min(0,...vals);const span=(hi-lo)||1;const yFor=v=>Bt-(v-lo)/span*(Bt-T);const y0=yFor(0);
 let s=`<line x1="${L}" y1="${y0}" x2="${W-R}" y2="${y0}" stroke="#c3c2b7"/>`;const cw=pw/mos.length;const bw=Math.min(26,cw*0.5);
 mos.forEach((mo,i)=>{const v=vals[i]||0;const y=yFor(v);const top=Math.min(y,y0),h=Math.max(1,Math.abs(y-y0));const c=v>=0?'#0ca30c':'#d03b3b';
  s+=`<rect x="${L+cw*(i+0.5)-bw/2}" y="${top}" width="${bw}" height="${h}" rx="3" fill="${c}"><title>${mo.label} กำไรสุทธิ ${B(v)}</title></rect>`;
  s+=`<text x="${L+cw*(i+0.5)}" y="${v>=0?top-4:top+h+11}" text-anchor="middle" font-size="9" font-weight="600" fill="${c}">${v?B0(v):''}</text>`;
  s+=`<text x="${L+cw*(i+0.5)}" y="${H-4}" text-anchor="middle" font-size="10" fill="#8a93a6">${mo.label}</text>`;});
 return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}">${s}</svg>`;}

 </div>
 <div class="grid stats" style="margin-bottom:22px">
   ${kpi('#e6f7f0','#0a7a5a',I.wallet,'เงินสดรับจริง',B0(cashIn)+' <small>฿</small>',pl)}
   ${kpi('#fbe6e6','#b02a2a',I.cash,'ลูกหนี้คงค้าง (ปัจจุบัน)',B0(ar)+' <small>฿</small>','ยังไม่ได้รับชำระ')}

 html+=`<tr style="background:var(--surface-2);font-weight:700"><td colspan="4">รวม (${rows.length} รายการ)</td><td class="num">${B(tot)}</td><td class="num">${B(tvat)}</td><td class="num" style="color:${twht?'var(--crit)':'inherit'}">${twht?B(twht):dash}</td><td class="num">${B(tnet)}</td><td></td><td></td></tr></tbody></table></div>`;

 if(twht>0)html+=`<div class="card" style="padding:12px 16px;margin-top:12px;background:#fdf3d9;border-color:#f2e2b3;font-size:12.5px;color:#8a6d1f">${I.alert} หัก ณ ที่จ่ายรวม <b>${B(twht)}</b> บาท — ต้องนำส่งสรรพากร (ภ.ง.ด.3 สำหรับบุคคลธรรมดา / ภ.ง.ด.53 สำหรับนิติบุคคล) ภายในวันที่ 7 ของเดือนถัดไป · จ่ายสุทธิให้ผู้รับ = ก่อน VAT + VAT − หัก ณ ที่จ่าย</div>`;
 document.getElementById('view').innerHTML=html;
}

 expItems=(k==='advance')?((e.items&&e.items.length)?e.items.map(it=>({desc:it.desc||'',amount:Number(it.amount)||0})):[{desc:'',amount:0}]):[];

 modal(`<div class="mh"><h3>${edit?'แก้ไขรายจ่าย':'เพิ่มรายจ่าย'}</h3><button class="x" onclick="closeModal()">✕</button></div>

function expKindChange(){const k=document.getElementById('e_kind').value;const adv=(k==='advance');
 document.getElementById('e_single').style.display=adv?'none':'';

 if(adv){if(!expItems.length)expItems=[{desc:'',amount:0}];renderExpItems();}else{renderExpWhtChips();updWhtMode();expCalc();}}

function expCalc(){const amtEl=document.getElementById('e_amount');if(!amtEl)return;const amt=Number(amtEl.value)||0;
 const hasVat=document.getElementById('e_hasvat').checked;const hasWht=document.getElementById('e_haswht').checked;

function rcTaxEvents(){const out=[];state.jobs.forEach(j=>{const vatable=(j.vat!==false);const rate=vatable?state.settings.vatRate:0;const insts=j.installments||[];
  if(insts.length){insts.forEach((i,ii)=>{if(i.rc&&i.rc.issued){const billed=instBase(j,i);const gross=Math.round((((Number(i.rc.amount)||0)+(Number(i.rc.wht)||0)))*100)/100;const base=gross>0?Math.round(gross/(1+rate)*100)/100:billed;out.push({date:i.rc.date,jobId:j.id,key:j.id+'#i'+ii,vatable:vatable,cust:cust(j.customerCode)?.name||'',base:base,vat:Math.round((gross>0?(gross-base):base*rate)*100)/100,docNo:docNumOf(j,'RC',i.no),note:'งวดที่ '+i.no});}});}
  else if(j.rcIssued){const c=compute(j);const pays=(j.payments||[]);
   if(!pays.length){out.push({date:billDate(j),jobId:j.id,key:j.id+'#full',vatable:vatable,cust:cust(j.customerCode)?.name||'',base:c.sub,vat:c.vat,docNo:docNumOf(j,'RC'),note:''});}
   else{const multi=pays.length>1;
    pays.forEach((p,pi)=>{                                  /* 1 ใบเสร็จ = 1 งวดรับเงินจริง ไม่ใช่ยอดเต็มบิล */
     const gross=Math.round(((Number(p.amount)||0)+(Number(p.wht)||0))*100)/100;
     const base=Math.round(gross/(1+rate)*100)/100;
     out.push({date:p.date||billDate(j),jobId:j.id,key:j.id+'#p'+pi,vatable:vatable,cust:cust(j.customerCode)?.name||'',base:base,vat:Math.round((gross-base)*100)/100,docNo:docNumOf(j,'RC',multi?(pi+1):null),note:multi?('รับเงินครั้งที่ '+(pi+1)):''});});}}});return out;}

 const matchedN=rcE.filter(e=>e._m&&e._m.exact).length;const unmatchedStmt=stmtCand.filter(s=>!s.used);const whtPct=+(wht*100).toFixed(2);

function viewDocs(){
 if(docFilter==='overdue')docFilter='all';   /* เลิกใช้แถบ “เกินกำหนด” แล้ว — ถ้าค่าเก่าค้างอยู่ให้กลับไปทั้งหมด */
 const base=state.jobs.filter(j=>docMonth==='all'||jobMonthKeys(j).indexOf(docMonth)>=0);
 const counts={all:base.length,qt:0,inv:0,pending:0,overdue:0,paid:0,hold:0};
 base.forEach(j=>{const c=compute(j);const h=isHold(j);
  if(h)counts.hold++;
  if(!jobBilled(j)&&!h)counts.qt++;                       /* งานที่ HOLD ไว้ ไม่นับว่าค้างวางบิล */
  if(jobBilled(j))counts.inv++;
  if((c.pay==='pending'||c.pay==='partial')&&!h)counts.pending++;
  if(c.overdue>0&&!h)counts.overdue++;
  if(c.pay==='paid')counts.paid++;});
 const chip=(k,l)=>`<button class="chip-f ${docFilter===k?'on':''}" onclick="docFilter='${k}';viewDocs()">${l}<span class="c">${counts[k]}</span></button>`;

 const months=docMonthList();

 {const sk=docSort.k,sd=docSort.dir;

let custSort={k:'code',dir:1};
function setCustSort(k){if(custSort.k===k)custSort.dir*=-1;else{custSort.k=k;custSort.dir=1;}viewCust();}
function viewCust(){
 let html;
 if(!state.customers.length){html=`<div class="card empty">${I.users}<b>ยังไม่มีลูกค้า</b>เพิ่มลูกค้าพร้อมรหัส เช่น QT01 QT02</div>`;}
 else{
  const sk=custSort.k,sd=custSort.dir;
  const list=state.customers.map(c=>({c,n:state.jobs.filter(j=>j.customerCode===c.code).length}));
  list.sort((x,y)=>{const r=(sk==='jobs')?(x.n-y.n):natCmp(x.c[sk],y.c[sk]);return (r||natCmp(x.c.code,y.c.code))*sd;});
  const th=(k,l,cls)=>sortTh(sk,k,sd,l,'setCustSort',cls);
  html=`<div class="card tbl-wrap"><table class="tbl"><thead><tr>${th('code','รหัส')}${th('name','ชื่อลูกค้า')}${th('taxId','เลขผู้เสียภาษี')}<th>ผู้ติดต่อ</th><th>โทรศัพท์</th>${th('jobs','งาน','num')}<th style="text-align:right">การทำงาน</th></tr></thead><tbody>`;
  list.forEach(({c})=>{const n=state.jobs.filter(j=>j.customerCode===c.code).length;html+=`<tr style="cursor:pointer" onclick="openCustDocs('${esc(c.code)}')"><td><span class="jobid">${esc(c.code)}</span></td><td style="font-weight:600">${esc(c.name)}</td><td class="mono">${esc(c.taxId||'-')}</td><td>${esc(c.contact||'-')}</td><td class="mono">${esc(c.phone||'-')}</td><td class="num">${n}</td><td style="text-align:right;white-space:nowrap" onclick="event.stopPropagation()"><button class="btn btn-p btn-sm" title="ดูเอกสาร/บิลของบริษัทนี้" onclick="openCustDocs('${esc(c.code)}')">${I.doc}ดูบิล/เอกสาร</button> <button class="btn btn-g btn-ic btn-sm" title="แก้ไข" onclick="openCust('${esc(c.code)}')">${I.edit}</button> <button class="btn btn-d btn-ic btn-sm" title="ลบ" onclick="delCust('${esc(c.code)}')">${I.trash}</button></td></tr>`;});
  html+=`</tbody></table></div>`;
 }
 document.getElementById('view').innerHTML=html;
}
/* ----- per-company document view (ดูบิล/เอกสารรายบริษัท) ----- */
function openCustDocs(code){const cu=cust(code)||{code:code,name:code};
 const jobs=state.jobs.filter(j=>j.customerCode===code);
 const rows=jobs.map(j=>({j,c:compute(j)})).sort((a,b)=>natCmp(a.j.id,b.j.id));
 let quoted=0,billed=0,received=0,outstanding=0;
 rows.forEach(({j,c})=>{quoted+=c.total;if(jobBilled(j)){billed+=c.billedAmt;received+=c.settled;outstanding+=Math.max(0,c.outstanding);}});
 const kbox=(lab,val,col)=>`<div style="flex:1;min-width:120px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px"><div style="font-size:11.5px;color:var(--muted)">${lab}</div><div style="font-size:16px;font-weight:700;color:${col||'var(--ink)'}">${val}</div></div>`;
 let body;
 if(!rows.length){body=`<div class="empty" style="padding:30px 10px">${I.doc}<b>ยังไม่มีงาน/เอกสารของบริษัทนี้</b>สร้างใบเสนอราคาให้ลูกค้ารายนี้ในเมนู “งาน / เอกสาร”</div>`;}
 else{
  const trows=rows.map(({j,c})=>{
   const insts=j.installments||[];
   let billCol,rcCol;
   if(insts.length){const paidN=insts.filter(i=>i.rc&&i.rc.issued).length;billCol=`<b>แบ่ง ${insts.length} งวด</b>`;rcCol=`<span class="tag ${paidN>0?'rc':'off'}">ใบเสร็จ ${paidN}/${insts.length}</span>`;}
   else if(j.inv&&j.inv.issued){billCol='เต็มจำนวน';rcCol=`<span class="tag ${j.rcIssued?'rc':'off'}">${j.rcIssued?'ออกใบเสร็จแล้ว':'ยังไม่ออกใบเสร็จ'}</span>`;}
   else{billCol=isHold(j)?'<span style="color:#8a6100;font-weight:600">⏸ พักไว้ (HOLD)</span>':'<span style="color:var(--muted)">— ยังไม่วางบิล</span>';rcCol=`<span class="tag off">ยังไม่มีใบเสร็จ</span>`;}
   const payPill=c.pay==='paid'?'<span class="pill good"><span class="dot"></span>ชำระแล้ว</span>':c.pay==='partial'?'<span class="pill warn"><span class="dot"></span>ชำระบางส่วน</span>':c.pay==='pending'?(c.overdue>0?`<span class="pill crit"><span class="dot"></span>เกิน ${c.overdue} วัน</span>`:'<span class="pill warn"><span class="dot"></span>รอชำระ</span>'):'<span class="pill mute"><span class="dot"></span>เสนอราคา</span>';
   return `<tr style="cursor:pointer" onclick="closeModal();openJob('${j.id}')"><td class="jobid">${j.id}</td><td class="mono">${dTH(j.qtDate)}</td><td class="num" style="font-weight:600">${B(c.total)}</td><td>${billCol}</td><td>${rcCol}</td><td class="num" style="color:${c.bal>0.005&&jobBilled(j)?'var(--crit)':'inherit'}">${jobBilled(j)?B(Math.max(0,c.bal)):'-'}</td><td>${payPill}</td></tr>`;
  }).join('');
  body=`<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
    ${kbox('จำนวนงาน',rows.length+' งาน')}
    ${kbox('มูลค่ารวม (เสนอราคา)',B(quoted)+' ฿')}
    ${kbox('วางบิลแล้ว',B(billed)+' ฿','var(--brand-d)')}
    ${kbox('รับชำระแล้ว',B(received)+' ฿','var(--good-ink)')}
    ${kbox('ค้างชำระ',B(outstanding)+' ฿',outstanding>0.005?'var(--crit)':'var(--good-ink)')}
   </div>
   <div class="tbl-wrap"><table class="tbl"><thead><tr><th>เลขที่งาน</th><th>วันที่</th><th class="num">ยอดงาน</th><th>การวางบิล</th><th>ใบเสร็จ/ใบกำกับภาษี</th><th class="num">คงเหลือ</th><th>สถานะ</th></tr></thead><tbody>${trows}</tbody></table></div>
   <div class="hint" style="margin-top:10px">คลิกที่แถวใดก็ได้เพื่อเปิดรายละเอียดงานนั้น — พิมพ์ใบเสนอราคา ใบวางบิล หรือออก/พิมพ์ใบเสร็จรายงวดได้</div>`;
 }
 modal(`<div class="mh"><h3>${esc(cu.name||code)} <span style="font-weight:400;font-size:13px;color:var(--muted)">· ${esc(code)}</span></h3><button class="x" onclick="closeModal()">✕</button></div>
  <div class="mb"><div style="font-size:12.5px;color:var(--ink-2);margin-bottom:12px">${cu.taxId?'เลขผู้เสียภาษี '+esc(cu.taxId):''}${cu.contact?' · ผู้ติดต่อ '+esc(cu.contact):''}${cu.phone?' · โทร. '+esc(cu.phone):''}</div>${body}</div>
  <div class="mf"><button class="btn btn-g" onclick="closeModal()">ปิด</button><button class="btn btn-p" onclick="closeModal();openQT(null,{cust:'${esc(code)}'})">${I.plus}สร้างใบเสนอราคาให้บริษัทนี้</button></div>`,true);
}

function genCode(){const a='abcdefghijkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<16;i++){s+=a[Math.floor(Math.random()*a.length)];if(i%4===3&&i<15)s+='-';}const el=document.getElementById('cl_code');if(el)el.value=s;}
/* เดิมเด้ง “เชื่อมต่อคลาวด์แล้ว” ทุกครั้งแม้ต่อไม่ติด — ต้องรอผลจริงก่อนแล้วค่อยบอก */
async function saveCloudCfg(){const url=(document.getElementById('cl_url').value||'').trim().replace(/\/+$/,'');const key=normKey(document.getElementById('cl_key').value);const code=(document.getElementById('cl_code').value||'').trim();cloudCfgSave({url,key,code});sbInit();
 const ke=document.getElementById('cl_key');if(ke)ke.value=key;
 if(!(url&&key&&code)){toast('บันทึกค่าแล้ว — ยังกรอกไม่ครบจึงยังไม่ซิงค์','err');return;}
 try{await cloudSyncStart();}catch(e){}
 if(sbState==='err'){toast('เชื่อมต่อคลาวด์ไม่สำเร็จ — กด “ตรวจสอบปัญหา”','err');try{render();}catch(e){}}
 else toast('เชื่อมต่อคลาวด์แล้ว','ok');}
async function cloudPullNow(){if(!sbReady()){toast('ยังไม่ได้ตั้งค่าคลาวด์ให้ครบ','err');return;}
 pullingCloud=true;let res;try{res=await cloudLoad();}finally{pullingCloud=false;}
 if(!res.ok){toast('ดึงไม่สำเร็จ: '+(sbLastErr||'เชื่อมต่อคลาวด์ไม่ได้')+' (ข้อมูลในเครื่องยังอยู่ครบ)','err');try{render();}catch(e){}return;}
 const cloud=res.data;
 if(cloud&&cloud.state)adoptCloud(cloud.state,cloud.savedAt,'ดึงข้อมูลจากคลาวด์แล้ว');
 else toast('ยังไม่มีข้อมูลในคลาวด์ (รหัสลับนี้ยังไม่เคยบันทึก)','err');}

function pickLogo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{try{const MAX=320;let w=img.width||1,h=img.height||1;const sc=Math.min(1,MAX/Math.max(w,h));w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);let out=cv.toDataURL('image/png');if(out.length>160000)out=cv.toDataURL('image/jpeg',0.85);state.settings.logo=out;}catch(err){state.settings.logo=e.target.result;}const p=document.getElementById('logoPrev');if(p){p.src=state.settings.logo;p.style.display='';}if(save())toast('อัปโหลดโลโก้แล้ว','ok');};img.onerror=()=>toast('ไฟล์รูปนี้อ่านไม่ได้','err');img.src=e.target.result;};r.readAsDataURL(f);}
function saveSettings(){const g=k=>document.getElementById('s_'+k).value;['companyName','addr1','addr2','taxId','branch','phone','email','website','bank','accName','accNo','bankBranch','footer','signName','signTitle'].forEach(k=>{const el=document.getElementById('s_'+k);if(el)state.settings[k]=el.value;});state.settings.vatRate=(parseFloat(document.getElementById('s_vat').value)||0)/100;state.settings.creditDays=parseInt(document.getElementById('s_credit').value)||0;state.settings.validDays=parseInt(document.getElementById('s_valid').value)||0;const ds=document.getElementById('s_docstyle');if(ds)state.settings.docStyle=ds.value;save();render();toast('บันทึกการตั้งค่าแล้ว','ok');}

function saveCust(edit){const g=k=>document.getElementById('c_'+k).value.trim();const code=g('code'),name=g('name');
 if(!code||!name){toast('กรุณากรอกรหัสและชื่อลูกค้า','err');return;}
 const orig=edit?(document.getElementById('c_origcode')||{value:''}).value.trim():'';
 if(code!==orig&&cust(code)){toast('รหัส "'+code+'" นี้มีลูกค้าใช้อยู่แล้ว','err');return;}
 const obj={code,name,address:g('address'),taxId:g('taxId'),contact:g('contact'),phone:g('phone'),email:g('email')};
 if(edit){const i=state.customers.findIndex(c=>c.code===orig);if(i<0){toast('ไม่พบลูกค้ารายนี้','err');return;}
  if(code!==orig){                                    /* ตรวจก่อนแก้ ห้ามแก้ค้างครึ่งทาง */
   const clash=state.jobs.filter(j=>j.customerCode!==orig).map(j=>j.id);
   const dup=state.jobs.filter(j=>j.customerCode===orig&&j.id&&j.id.slice(0,orig.length+1)===orig+'-').map(j=>code+j.id.slice(orig.length)).filter(id=>clash.indexOf(id)>=0);
   if(dup.length){toast('เปลี่ยนรหัสไม่ได้ เพราะเลขที่เอกสารจะซ้ำกับงานเดิม ('+dup[0]+')','err');return;}
  }
  state.customers[i]=obj;
  if(code!==orig){
   let n=0;state.jobs.forEach(j=>{if(j.customerCode===orig){j.customerCode=code;if(j.id&&j.id.slice(0,orig.length+1)===orig+'-')j.id=code+j.id.slice(orig.length);n++;}});
   save();closeModal();render();toast('เปลี่ยนรหัสเป็น '+code+' แล้ว'+(n?' (อัปเดตเอกสาร '+n+' รายการ)':''),'ok');return;}}
 else state.customers.push(obj);
 save();closeModal();render();toast('บันทึกลูกค้าแล้ว','ok');}

 </div>
 <div class="mf"><button class="btn btn-g" onclick="closeModal()">ยกเลิก</button><button class="btn btn-p" onclick="saveQT('${id||''}')">${I.check}บันทึกใบเสนอราคา</button></div>`,true);

function renderItems(){const tb=document.getElementById('itemRows');tb.innerHTML=draftItems.map((it,i)=>`<tr>
  <td><input value="${esc(it.desc)}" oninput="draftItems[${i}].desc=this.value"></td>
  <td><input type="number" step="any" value="${it.qty}" oninput="draftItems[${i}].qty=this.value;calcSum()" style="text-align:right"></td>
  <td><input value="${esc(it.unit)}" oninput="draftItems[${i}].unit=this.value"></td>
  <td><input type="number" step="any" value="${it.price}" oninput="draftItems[${i}].price=this.value;calcSum()" style="text-align:right"></td>
  <td><button class="del" onclick="draftItems.splice(${i},1);renderItems()">${I.trash}</button></td></tr>`).join('');calcSum();}
function addItem(){draftItems.push({desc:'',qty:1,unit:'',price:0});renderItems();}
function calcSum(){const sub=draftItems.reduce((a,i)=>a+(Number(i.qty)||0)*(Number(i.price)||0),0);const el=document.getElementById('q_vat');const rate=(el&&!el.checked)?0:state.settings.vatRate;const vat=Math.round(sub*rate*100)/100;document.getElementById('sumBox').innerHTML=`<div class="r"><span>รวมเป็นเงิน</span><b>${B(sub)}</b></div><div class="r"><span>ภาษีมูลค่าเพิ่ม ${(rate*100).toFixed(0)}%</span><b>${B(vat)}</b></div><div class="r tot"><span>ยอดรวมทั้งสิ้น</span><span>${B(sub+vat)}</span></div>`;}
function saveQT(id){const items=draftItems.filter(i=>i.desc.trim()||Number(i.price)>0).map(i=>({desc:i.desc.trim(),qty:Number(i.qty)||0,unit:i.unit.trim(),price:Number(i.price)||0}));if(!items.length){toast('กรุณาเพิ่มอย่างน้อย 1 รายการ','err');return;}const note=document.getElementById('q_note').value,status=document.getElementById('q_status').value;const vat=document.getElementById('q_vat')?document.getElementById('q_vat').checked:true;const project=document.getElementById('q_project')?document.getElementById('q_project').value.trim():'';const terms=document.getElementById('q_terms')?document.getElementById('q_terms').value:'';
 if(id){const j=state.jobs.find(x=>x.id===id);j.items=items;j.note=note;j.status=status;j.vat=vat;j.project=project;j.terms=terms;toast('แก้ไขใบเสนอราคาแล้ว','ok');}
 else{const code=document.getElementById('q_cust').value,date=parseDMY(document.getElementById('q_date').value)||todayISO();if(!code){toast('กรุณาเลือกลูกค้า','err');return;}const nid=nextId(code,date);state.jobs.push({id:nid,customerCode:code,qtDate:date,status,note,terms,items,vat,project,inv:null,payments:[],rcIssued:false});toast('สร้างใบเสนอราคา '+nid,'ok');}
 save();closeModal();render();}

function openJob(id){const j=state.jobs.find(x=>x.id===id);const c=compute(j);const cu=cust(j.customerCode);
 const hasInv=j.inv&&j.inv.issued;const insts=j.installments||[];const hasInst=insts.length>0;
 const payPill=c.pay==='paid'?'<span class="pill good"><span class="dot"></span>ชำระแล้ว</span>':c.pay==='partial'?'<span class="pill warn"><span class="dot"></span>ชำระบางส่วน</span>':c.pay==='pending'?(c.overdue>0?`<span class="pill crit"><span class="dot"></span>เกินกำหนด ${c.overdue} วัน</span>`:'<span class="pill warn"><span class="dot"></span>รอชำระ</span>'):'<span class="pill mute"><span class="dot"></span>ยังไม่วางบิล</span>';

    :`<button class="btn btn-g btn-ic btn-sm" title="แก้ไขงวดนี้ (ยอด/วันที่/เครดิต)" onclick="editInst('${j.id}',${idx})">${I.edit}</button> <button class="btn btn-g btn-ic btn-sm" title="พิมพ์ใบวางบิล" onclick="printDoc('${j.id}','INV',{ii:${idx}})">${I.print}</button> <button class="btn btn-p btn-sm" title="รับเงินและออกใบเสร็จ" onclick="payInst('${j.id}',${idx})">${I.cash}รับเงิน</button> <button class="btn btn-d btn-ic btn-sm" title="ลบงวดนี้" onclick="delInst('${j.id}',${idx})">${I.trash}</button>`;
   return `<tr><td class="c" style="font-weight:700">${it.no}</td><td class="c">${instPctOf(j,it)}%</td><td class="num" style="font-weight:600">${B(amt)}</td><td class="mono">${dTH(it.date)}${paid?`<div style="font-size:11px;color:var(--good-ink);margin-top:2px">รับเงิน ${dTH(it.rc.date)}</div>`:`<div style="font-size:11px;color:var(--muted);margin-top:2px">ครบกำหนด ${dTH(dueD)}</div>`}</td><td>${st}</td><td style="text-align:right;white-space:nowrap">${act}</td></tr>`;
  }).join('');
  const sumPct=c.sumPct;

  <div class="tbl-wrap"><table class="tbl" style="border:1px solid var(--line);border-radius:10px"><thead><tr><th class="c">งวด</th><th class="c">สัดส่วน</th><th class="num">จำนวนเงิน</th><th>วันที่วางบิล</th><th>สถานะ</th><th style="text-align:right">จัดการ</th></tr></thead><tbody>${instRows}</tbody></table></div>`;
 }
 const payHist=(!hasInst&&(j.payments||[]).length)?`<div class="sec-t" style="font-size:13px;margin-top:18px">ประวัติการรับเงิน</div><table class="tbl" style="border:1px solid var(--line);border-radius:10px"><thead><tr><th>วันที่</th><th>วิธี</th><th class="num">รับเงิน</th></tr></thead><tbody>${j.payments.map(p=>`<tr><td>${dTH(p.date)}</td><td>${esc(p.method)}</td><td class="num">${B(p.amount)}</td></tr>`).join('')}</tbody></table>`:'';
 const billed=jobBilled(j);
 const sumExtra=billed?`<div class="r"><span>วางบิลแล้ว</span><b>${B(c.billedAmt)}</b></div><div class="r" style="color:var(--good-ink)"><span>รับชำระแล้ว</span><b>${B(c.settled)}</b></div><div class="r" style="color:${c.bal>0.005?'var(--crit)':'var(--good-ink)'}"><span>คงเหลือทั้งงาน</span><b>${B(Math.max(0,c.bal))}</b></div>`:'';
 /* footer action (right) by state */
 let actRight;
 if(hasInst){actRight=`<button class="btn btn-p btn-sm" onclick="addInst('${j.id}')">${I.plus}เพิ่มงวดวางบิล</button>`+(c.pay==='paid'?` <span class="pill good"><span class="dot"></span>เก็บเงินครบแล้ว</span>`:'');}
 else if(hasInv){const hasPay=(j.payments||[]).length>0;actRight=(c.pay!=='paid'?`<button class="btn btn-g btn-sm" onclick="toInst('${j.id}')">${I.doc}เปลี่ยนเป็นแบ่งงวด</button> <button class="btn btn-p btn-sm" onclick="openPay('${j.id}')">${I.cash}บันทึกรับเงิน</button>`:`<span class="pill good"><span class="dot"></span>เก็บเงินครบแล้ว</span>`)+(hasPay?` <button class="btn btn-g btn-sm" title="ยกเลิกการรับเงิน (กดผิด)" onclick="unpayJob('${j.id}')">↩ ยังไม่ได้รับเงิน</button>`:'');}
 else{actRight=`<button class="btn btn-g btn-sm" onclick="issueInv('${j.id}')">${I.arrow}ออกใบแจ้งหนี้เต็มจำนวน</button> <button class="btn btn-p btn-sm" onclick="addInst('${j.id}')">${I.doc}วางบิลแบ่งงวด (งวดที่ 1, 2, 3…)</button>`;}
 modal(`<div class="mh"><h3>${j.id}</h3><button class="x" onclick="closeModal()">✕</button></div>
 <div class="mb">

   <div><div style="font-size:12px;color:var(--muted)">ลูกค้า</div><div style="font-weight:700;font-size:15px">${esc(cu?.name||'—')}</div><div style="font-size:12px;color:var(--ink-2)">${esc(cu?.taxId||'')}</div></div>

  <table class="it doc" style="width:100%;font-size:12.5px;margin-top:10px"><thead><tr><th class="c" style="width:8%">#</th><th>รายละเอียด</th><th class="c">จำนวน</th><th class="c">หน่วย</th><th class="num">ราคา/หน่วย</th><th class="num">รวม</th></tr></thead><tbody>${itemRows}</tbody></table>

function fitPrint(){const pr=document.getElementById('print');if(!pr)return;
 const maxH=Math.floor((297-20)*96/25.4)-6;                     /* ความสูงที่พิมพ์ได้ของ A4 ขอบ 10mm (เผื่อเศษ 6px) */
 const sv={d:pr.style.display,p:pr.style.position,l:pr.style.left,t:pr.style.top,w:pr.style.width};
 pr.style.display='block';pr.style.position='absolute';pr.style.left='-10000px';pr.style.top='0';pr.style.width='210mm';
 pr.querySelectorAll('.doc').forEach(d=>{
  d.style.zoom='';
  let z=1,h=d.getBoundingClientRect().height;                   /* ต้องใช้ค่านี้ เพราะสะท้อนผลของ zoom จริง */
  for(let i=0;i<12&&h>maxH&&z>0.6;i++){                          /* ย่อทีละรอบ เพราะย่อแล้วข้อความจัดบรรทัดใหม่ */
   z=Math.max(0.6,z*(maxH/h)*0.995);
   d.style.zoom=String(Math.floor(z*1000)/1000);
   h=d.getBoundingClientRect().height;
  }
  if(z>=0.999)d.style.zoom='';
 });
 pr.style.display=sv.d;pr.style.position=sv.p;pr.style.left=sv.l;pr.style.top=sv.t;pr.style.width=sv.w;}

function loadPdfJs(){return new Promise((res,rej)=>{if(window.pdfjsLib){res(window.pdfjsLib);return;}const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=()=>{if(window.pdfjsLib){try{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}catch(e){}res(window.pdfjsLib);}else rej();};s.onerror=()=>rej();document.head.appendChild(s);});}
async function importStmtPdf(file,pw){window.__pdfFile=file;window.__pdfRetry=importStmtPdf;toast('กำลังอ่าน PDF...');let lib;try{lib=await loadPdfJs();}catch(e){toast('โหลดตัวอ่าน PDF ไม่ได้ (ต้องต่ออินเทอร์เน็ต) — แนะนำใช้ Excel/CSV แทน','err');return;}
 try{const buf=await file.arrayBuffer();let pdf;
  try{pdf=await lib.getDocument({data:new Uint8Array(buf),password:pw||''}).promise;}
  catch(err){if(err&&(err.name==='PasswordException'||err.code===1||err.code===2||/password/i.test(String(err.message||'')))){askPdfPassword(file,!!pw);return;}throw err;}
  let lines=[];
  for(let p=1;p<=pdf.numPages;p++){const pg=await pdf.getPage(p);const tc=await pg.getTextContent();const byY={};tc.items.forEach(it=>{const y=Math.round(it.transform[5]);(byY[y]=byY[y]||[]).push(it);});Object.keys(byY).map(Number).sort((a,b)=>b-a).forEach(y=>{const parts=byY[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str);const ln=parts.join(' ').replace(/\s+/g,' ').trim();if(ln)lines.push(ln);});}
  const P=[];let prevBal=null;
  const CH=['Internet/Mobile SCB','Internet/Mobile','K BIZ','K-BIZ','KBIZ','โอนเข้า/หักบัญชีอัตโนมัติ','ATM/CDM','ATM','CDM','เคาน์เตอร์ธนาคาร','เคาน์เตอร์','พร้อมเพย์','PromptPay','Mobile Banking','Bill Payment','Cash Deposit'];
  const money=s=>{const r=[],re=/\d{1,3}(?:,\d{3})*\.\d{2}/g;let m;while((m=re.exec(s))){r.push({v:Number(m[0].replace(/,/g,'')),s:m.index,e:m.index+m[0].length});}return r;};
  const mkdate=(d,mo,y)=>{let yy=parseInt(y);if(y.length<=2)yy=2000+yy;else if(yy>2500)yy-=543;return yy+'-'+String(parseInt(mo)).padStart(2,'0')+'-'+String(parseInt(d)).padStart(2,'0');};
  lines.forEach(ln=>{const dm=ln.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);if(!dm)return;const nums=money(ln);
    if(/ยอดยกมา|ยอดยกไป/.test(ln)){if(nums.length)prevBal=nums[0].v;return;}
    if(!nums.length)return;
    const amount=nums[0].v;const bal=nums.length>=2?nums[1].v:null;
    const tm=ln.match(/(\d{1,2}:\d{2})/);const time=tm?tm[1]:'';
    let head=ln.substring(dm[0].length,nums[0].s);if(tm)head=head.replace(tm[1],'');const type=head.replace(/\s+/g,' ').trim();
    let rest=(nums.length>=2?ln.substring(nums[1].e):ln.substring(nums[0].e)).replace(/\s+/g,' ').trim();
    let channel='';for(const c of CH){if(rest.indexOf(c)===0){channel=c;rest=rest.substring(c.length).trim();break;}}
    if(!channel){for(const c of CH){const i=rest.indexOf(c);if(i>=0){channel=c;rest=(rest.substring(0,i)+' '+rest.substring(i+c.length)).replace(/\s+/g,' ').trim();break;}}}
    let mi=0,mo=0;
    if(bal!=null&&prevBal!=null){const delta=Math.round((bal-prevBal)*100)/100;if(delta>=0)mi=amount;else mo=amount;}
    else{const isOut=/(ชำระ|โอนเงิน|โอนไป|ถอน|ค่าธรรมเนียม|จ่าย|หัก|fee|debit|payment)/i.test(type);if(isOut)mo=amount;else mi=amount;}
    if(bal!=null)prevBal=bal;
    const desc=(type||'')+(rest?(type?' — ':'')+rest:'');
    P.push({date:mkdate(dm[1],dm[2],dm[3]),time,desc:desc.slice(0,90)||'(รายการ)',channel,moneyIn:mi,moneyOut:mo,balance:bal||0,note:'จาก PDF'});});
  if(!P.length){toast('อ่านไม่พบรายการ (อาจเป็น PDF สแกน/รูปภาพ) — แนะนำใช้ Excel/CSV หรือส่งไฟล์ให้ช่วยปรับ','err');return;}stmtReview(P);
 }catch(err){console.log(err);toast('อ่าน PDF ไม่สำเร็จ (ไฟล์อาจเสียหายหรือเป็นรูปภาพสแกน)','err');}}

function xdate(v){if(v==null||v==='')return '';if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);if(d)return d.y+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0');}if(v instanceof Date)return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');const s=String(v).trim();if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m){let y=parseInt(m[3]);if(y>2400)y-=543;return String(y)+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');}return s;}

function pndRows(month,type){const map={};(state.expenses||[]).forEach(e=>{const wht=Number(e.wht)||0;if(wht<=0)return;if(!inMonth(e.date,month))return;if(expPndType(e)!==type)return;const pay=e.payeeId?(state.payees||[]).find(p=>p.id===e.payeeId):null;const rate=Number(e.whtRate)||0;const key=(e.payeeId||('nm:'+(e.payee||'-')))+'|'+rate;if(!map[key])map[key]={name:pay?pay.name:(e.payee||'-'),taxId:pay?(pay.taxId||''):'',address:pay?(pay.address||''):'',incomeType:pndIncomeType(e,pay,type),rate:rate,base:0,tax:0,dates:[],n:0,hasPayee:!!pay,payeeId:e.payeeId||''};const g=map[key];g.base+=Number(e.amount)||0;g.tax+=wht;g.dates.push(e.date);g.n++;});return Object.values(map).map(g=>{g.base=Math.round(g.base*100)/100;g.tax=Math.round(g.tax*100)/100;g.dates.sort();g.date=g.dates[g.dates.length-1];return g;}).sort((a,b)=>a.name<b.name?-1:1);}
let pndMonth='all';let pndType='3';
function pndMonthList(){const s={};(state.expenses||[]).forEach(e=>{if((Number(e.wht)||0)>0&&e.date)s[e.date.slice(0,7)]=1;});return Object.keys(s).sort().reverse();}
function setPndMonth(m){pndMonth=m;viewPnd();}
function setPndType(t){pndType=t;viewPnd();}
function viewPnd(){const months=pndMonthList();const chip=(k,l)=>`<button class="chip-f ${pndMonth===k?'on':''}" onclick="setPndMonth('${k}')">${l}</button>`;
 const pl=pndMonth==='all'?'ทุกเดือน':ymLabel(pndMonth);const rows=pndRows(pndMonth,pndType);
 const tBase=Math.round(rows.reduce((a,r)=>a+r.base,0)*100)/100;const tTax=Math.round(rows.reduce((a,r)=>a+r.tax,0)*100)/100;
 const tbtn=(t,l,sub)=>`<button class="chip-f ${pndType===t?'on':''}" onclick="setPndType('${t}')" style="padding:8px 16px;text-align:left">${l}<span style="display:block;font-size:10.5px;font-weight:400;opacity:.85">${sub}</span></button>`;
 const kpi=(bg,ink,ic,lab,val,meta)=>`<div class="card stat"><div class="lab"><span class="chip" style="background:${bg};color:${ink}">${ic}</span>${lab}</div><div class="val">${val}</div><div class="meta">${meta||''}</div></div>`;
 let html=`<div class="chips">${chip('all','ทุกเดือน')}${months.map(k=>chip(k,ymLabel(k))).join('')}</div>`;
 html+=`<div style="display:flex;gap:10px;margin:2px 0 16px;flex-wrap:wrap">${tbtn('3','ภ.ง.ด.3','ฟรีแลนซ์ / ผู้รับจ้าง บุคคลธรรมดา')}${tbtn('1','ภ.ง.ด.1','พนักงานประจำ เงินเดือน')}</div>`;
 html+=`<div class="grid stats" style="margin-bottom:16px">${kpi('#e7f0fc','#2560a8',I.users,'จำนวนผู้รับเงิน',rows.length+' <small>ราย</small>','แบบ ภ.ง.ด.'+pndType+' · '+pl)}${kpi('#eef6ee','#128041',I.money,'ยอดจ่ายรวม',B0(tBase)+' <small>฿</small>','ก่อนหักภาษี')}${kpi('#fbe9e9','#b02a2a',I.down,'ภาษีหัก ณ ที่จ่ายรวม',B0(tTax)+' <small>฿</small>','ต้องนำส่งสรรพากร')}</div>`;
 if(rows.length){const missing=rows.filter(r=>!r.taxId).length;
  html+=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px"><div class="sec-t" style="margin:0">ใบแนบ ภ.ง.ด.${pndType} — ${pl}</div><button class="btn btn-p" onclick="printPnd()">${I.file} พิมพ์แบบ ภ.ง.ด.${pndType} + ใบแนบ</button></div>`;

  rows.forEach((r,i)=>{html+=`<tr><td>${i+1}</td><td class="mono">${r.taxId?esc(r.taxId):'<span style="color:var(--crit)">— ไม่มี —</span>'}</td><td>${esc(r.name)}${r.n>1?` <span style="color:var(--muted);font-size:11px">(${r.n} ครั้ง)</span>`:''}${r.hasPayee?'':' <span class="pill" style="background:#fdf0e0;color:#b5651d;font-size:10px">ยังไม่ผูกโปรไฟล์</span>'}</td><td style="font-size:12px">${esc(r.incomeType)}</td><td class="mono">${dTH(r.date)}</td><td class="num">${B(r.base)}</td><td class="num">${(+(r.rate*100).toFixed(2))}%</td><td class="num" style="color:var(--crit);font-weight:600">${B(r.tax)}</td><td><button class="btn btn-p btn-sm" onclick="openWht50(${i})">${I.file} 50 ทวิ</button></td></tr>`;});
  html+=`<tr style="background:var(--surface-2);font-weight:700"><td colspan="5">รวม</td><td class="num">${B(tBase)}</td><td></td><td class="num" style="color:var(--crit)">${B(tTax)}</td><td></td></tr></tbody></table></div>`;
  if(missing)html+=`<div class="card" style="padding:12px 16px;margin-top:12px;background:#fdf3d9;border-color:#f2e2b3;font-size:12.5px;color:#8a6d1f">${I.alert} มี ${missing} รายที่ยังไม่มีเลขผู้เสียภาษี — กด “จัดการรายชื่อ” เพื่อเพิ่มเลขบัตร/ที่อยู่ แล้วผูกกับรายจ่ายในหน้ารายจ่าย เพื่อให้ฟอร์มสมบูรณ์</div>`;
 }else{html+=`<div class="card empty">${I.file}<b>ยังไม่มีรายการหัก ณ ที่จ่ายสำหรับ ภ.ง.ด.${pndType} ในช่วงนี้</b>บันทึกรายจ่ายที่ “มีหัก ณ ที่จ่าย” แล้วเลือกผู้รับเงิน ระบบจะดึงมากรอกให้อัตโนมัติ</div>`;}
 document.getElementById('view').innerHTML=html;}

 return `<div class="doc ${s.docStyle==='ink'?'ink':''}"><div class="accent"></div><div class="pad">

function pnd3OverlayHTML(data){const s=state.settings;const r=data.r;const sec=data.section||'3tres';const issue=data.issueType||'withhold';const desc=data.incomeDesc||'';
 const PM=0.352778;const mm=v=>(v*PM).toFixed(2)+'mm';
 const ov=(x,top,txt,o)=>{o=o||{};let st='left:'+mm(x)+';top:'+mm(top)+';font-size:'+(o.fs||2.5)+'mm;';if(o.w){st+='width:'+mm(o.w)+';text-align:'+(o.align||'left')+';';}return '<span style="'+st+'">'+txt+'</span>';};
 const chk=(x,top)=>ov(x+1,top-0.5,'✓',{fs:3.2});
 const idbox=(x0,top,w,val)=>{val=String(val||'').replace(/\D/g,'');const groups=[1,4,5,2,1],gap=0.62;const units=13+gap*(groups.length-1);const u=w/units;let cx=x0,gi=0,gc=0,h='';for(let i=0;i<13;i++){if(val[i])h+=ov(cx,top,val[i],{w:u,align:'center',fs:2.7});cx+=u;gc++;if(gc===groups[gi]&&gi<groups.length-1){cx+=u*gap;gi++;gc=0;}}return h;};
 const rowsMap={'40(1)':{d:[327,300],a:[411,300],t:[496,300]},'40(2)':{d:[328,314.5],a:[410,314.5],t:[495.5,314.5]},'40(3)':{d:[327.7,329],a:[410.8,329],t:[495.5,329]},'40(4)':{d:[328,343.5],a:[411.6,343.5],t:[495.5,343.5]},'3tres':{d:[326.5,619],a:[409.4,619],t:[496.4,619]},'other':{d:[326.5,633.5],a:[409.4,633.5],t:[496.4,633.5]}};
 let o='';
 o+=idbox(376,86,182,s.taxId);
 o+=ov(53,103.5,esc(s.companyName||''),{fs:2.4});
 o+=ov(60,124.5,esc(((s.addr1||'')+' '+(s.addr2||'')).trim()),{fs:2.3});
 o+=idbox(377,154.5,181,r.taxId);
 o+=ov(53,176.5,esc(r.name||''),{fs:2.4});
 o+=ov(60,201.5,esc(r.address||''),{fs:2.3});
 if(sec==='40(1)')o+=chk(209.3,227);else o+=chk(471.3,227.8);
 const rm=rowsMap[sec]||rowsMap['3tres'];
 o+=ov(rm.d[0],rm.d[1],dTH(r.date),{w:76,align:'center',fs:2.4});
 o+=ov(rm.a[0],rm.a[1],B(r.base),{w:77,align:'right',fs:2.5});
 o+=ov(rm.t[0],rm.t[1],B(r.tax),{w:62,align:'right',fs:2.5});
 if(sec==='other'&&desc)o+=ov(102,633.5,esc(desc),{fs:2.3});
 o+=ov(409.4,656,B(r.base),{w:77,align:'right',fs:2.6});
 o+=ov(495.5,656,B(r.tax),{w:62,align:'right',fs:2.6});
 o+=ov(188,678,bahttext(r.tax),{fs:2.5});
 const pc={withhold:[82.5,711.5],forever:[177.3,710],once:[282.3,710.5],other:[393.7,711]}[issue]||[82.5,711.5];
 o+=chk(pc[0],pc[1]);
 if(issue==='other'&&desc)o+=ov(472,710,esc(desc),{fs:2.1});
 o+=ov(345,745,esc(s.signName||''),{w:110,align:'center',fs:2.1});
 const dp=String(r.date).split('-');
 if(dp.length===3){o+=ov(340,755,dp[2].slice(0,2),{w:24,align:'center',fs:2.5});o+=ov(362,755,dp[1],{w:66,align:'center',fs:2.5});o+=ov(428,755.5,dp[0],{w:42,align:'center',fs:2.5});}
 return `<div class="pnd3wrap"><div class="pnd3" style="background-image:url('${WH3BG}')">${o}</div></div>`;}

{const _l=load();
 if(loadCorrupt){                                     /* อ่านข้อมูลเดิมไม่ได้ = เริ่มเปล่า + ห้ามส่งขึ้นคลาวด์จนกว่าจะดึงของจริงลงมา */
